name: Prueba de Telegram - Carreteras cortadas Andalucía

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carreteras-cortadas-andalucia-prueba-telegram
  cancel-in-progress: false

jobs:
  probar-telegram:
    name: Enviar mensaje de prueba al canal nuevo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Enviar una carretera de prueba con el formato real
        shell: bash
        run: |
          python - <<'PY'
          import sys

          sys.path.insert(0, "src")

          from logic import EVENT_CLOSED, format_message
          from telegram import send_message

          sample = {
              "source_ids": ["prueba-formato"],
              "situation_ids": ["prueba"],
              "record_ids": ["prueba"],
              "province": "Sevilla",
              "localities": ["Sevilla"],
              "road": "A-8005",
              "km_start": 0,
              "km_end": 2.160,
              "direction": "both",
              "reason": "Obras",
              "published_at": "2026-08-27T10:30:00+02:00",
          }
          send_message(format_message(sample, EVENT_CLOSED))
          PY

