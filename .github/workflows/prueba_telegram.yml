name: Prueba de Telegram - Carreteras cortadas Andalucía

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carreteras-cortadas-andalucia-prueba-telegram
  cancel-in-progress: false

jobs:
  probar-telegram:
    name: Enviar mensaje de prueba al canal nuevo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Enviar prueba inequivoca del bot nuevo
        shell: bash
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat_id:
              raise SystemExit(
                  "Faltan TELEGRAM_BOT_TOKEN o TELEGRAM_CHAT_ID en los "
                  "Repository secrets."
              )

          message = (
              "\u2705 PRUEBA CORRECTA DEL BOT NUEVO\n\n"
              "Carreteras cortadas - Andalucía\n"
              "Canal general de cortes completos de la DGT en Andalucía.\n"
              "Incluye todos los motivos de corte."
          )
          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data={
                  "chat_id": chat_id,
                  "text": message,
                  "disable_web_page_preview": "true",
              },
              timeout=30,
          )
          response.raise_for_status()
          if response.json().get("ok") is not True:
              raise SystemExit("Telegram no confirmo el envio del mensaje.")
          PY

